name: DACH job collector

on:
  schedule:
    - cron: "0 6,9,12,15,18 * * 1-5"
      timezone: Europe/Berlin
    - cron: "0 9 * * 0,6"
      timezone: Europe/Berlin
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dach-job-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Check out private persistent state
        uses: actions/checkout@v4
        with:
          repository: PredictivePro/dach-job-monitor-state
          token: ${{ secrets.STATE_REPO_TOKEN }}
          path: .job-monitor-state

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect jobs and send alerts
        env:
          PYTHONPATH: src
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          NOTIFICATION_PROVIDER: smtp
          JOB_MONITOR_DB: .job-monitor-state/monitor.sqlite
          JOB_MONITOR_BRONZE: .job-monitor-state/bronze
          JOB_MONITOR_GOLD: docs/data/monitoring.json
        run: |
          if [ -s "$JOB_MONITOR_DB" ]; then
            python -m job_monitor.runner
          else
            echo "No saved history yet; creating a quiet initial baseline."
            python -m job_monitor.runner --bootstrap
          fi

      - name: Save durable state
        env:
          STATE_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
        shell: bash
        run: |
          cd .job-monitor-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor.sqlite bronze
          if ! git diff --cached --quiet; then
            git commit -m "Update job monitor state"
            git push
          fi

      - name: Publish dashboard data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/monitoring.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh job monitoring dashboard data"
            git push
          fi
